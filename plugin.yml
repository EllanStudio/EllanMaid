name: EllanMaid
version: 0.7.0
main: studio.ellan.maid.EllanMaid
api-version: '26.1.2'
folia-supported: true
depend: [ModelEngine, CraftEngine]
softdepend: [CustomCrops, CustomFishing, MythicMobs, SparrowSync]
description: Touhou Little Maid style maids for Paper, built on ModelEngine and CraftEngine (EllanStudio)
commands:
  ellanmaid:
    description: Maid admin command
    usage: /ellanmaid <give|summon|reload> ...
    permission: ellanmaid.admin
  maid:
    description: 女仆玩法说明
    usage: /maid [summon|care|work|travel|more]
    aliases: [女仆, nvpu]
    permission: ellanmaid.guide
permissions:
  ellanmaid.guide:
    default: true
  ellanmaid.admin:
    default: op
